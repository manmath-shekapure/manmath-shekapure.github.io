<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop</title>

  <link rel="stylesheet" href="/project/E-commerce/bootstrap.min.css">
  <link rel="stylesheet" href="/project/E-commerce/style.css">
</head>

<body>

  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid">

      <a class="navbar-brand" href="./index.html">MyShop</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarPremium">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarPremium">

        <ul class="navbar-nav me-auto mb-2 mb-lg-0">

          <li class="nav-item">
            <a class="nav-link active" href="shop.html">Shop</a>
          </li>
          <!-- FLOATING CART BUTTON -->
        <button class="cart-btn" onclick="openCart()">
  🛒 Cart <span id="cartCount">0</span>
            </button>
 

        </ul>

        <form class="d-flex" role="search" onsubmit="return false;">
          <input class="form-control me-2" id="searchInput" type="search" placeholder="Search Product">
          <button class="btn btn-outline-success" id="searchBtn">Search</button>
        </form>

      </div>
    </div>
  </nav>


  <!-- LEFT CART CANVAS -->
  <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvas" aria-labelledby="offcanvasLabel">
    <div class="offcanvas-header">
      <h5 class="offcanvas-title" id="offcanvasLabel">My Cart</h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>

    <div class="offcanvas-body">
      <table class="table table-bordered">
        <thead>
          <tr>
            <th>Product</th>
            <th>Qty</th>
            <th>Price</th>
            <th>Total</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="cartBody"></tbody>
      </table>

      <h5>Total Amount: <span id="cartTotal">0</span></h5>
      <button class="btn btn-success w-100">Buy Now</button>
    </div>
  </div>


  <!-- PRODUCT LIST -->
  <div class="container mt-4">
    <div class="row" id="productList"></div>
  </div>

  <nav class="mt-4">
    <ul class="pagination justify-content-center" id="pagination"></ul>
  </nav>


  <script src="/project/E-commerce/bootstrap.bundle.js"></script>
  <script src="/project/E-commerce/app.js"></script>

</body>

</html>
