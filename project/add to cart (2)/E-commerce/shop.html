<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop</title>

  <link rel="stylesheet" href="./bootstrap.min.css">
  <link rel="stylesheet" href="./style.css">

  <style>

#filterBox {
  display: none;
  width: 280px;
  padding: 20px;
  position: absolute;
  z-index: 999;


  left: 150px;
  top: 70px;

  background: linear-gradient(135deg, #ffffff, #f3f3ff);
  border-radius: 18px;

  border: 2px solid transparent;
  background-clip: padding-box;

  box-shadow: 0 12px 35px rgba(0, 0, 0, 0.20);

  
  animation: filterFade 0.35s ease-out, neonGlow 4s infinite linear alternate;
}


@keyframes filterFade {
  0% {
    opacity: 0;
    transform: translateY(-12px) scale(0.90);
  }
  100% {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}


@keyframes neonGlow {
  0% {
    border-color: #ff4dff;
    box-shadow: 0 0 8px #ff4dff, 0 0 16px #bd5bff;
  }
  50% {
    border-color: #4dd2ff;
    box-shadow: 0 0 10px #4dd2ff, 0 0 18px #009dff;
  }
  100% {
    border-color: #ff944d;
    box-shadow: 0 0 8px #ff944d, 0 0 14px #ff6600;
  }
}



.filter-section {
  display: none;
  background: rgba(255, 255, 255, 0.75);
  padding: 12px;
  margin-bottom: 16px;
  border-radius: 12px;
  border-left: 5px solid #007bff;
  backdrop-filter: blur(5px);
  transition: 0.35s ease;
  animation: sectionSlide 0.4s ease;
}


@keyframes sectionSlide {
  from {
    opacity: 0;
    transform: translateY(-10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.filter-section:hover {
  background: rgba(240, 245, 255, 0.95);
  transform: scale(1.02);
}

.filter-section label {
  font-size: 15px;
  font-weight: 700;
  margin-bottom: 6px;
  color: #333;
}


.filter-section select {
  width: 100%;
  height: 42px;
  border-radius: 10px;
  border: 1px solid #ccc;
  padding: 8px 10px;
  font-size: 14px;
  transition: 0.3s ease;
}

.filter-section select:hover,
.filter-section select:focus {
  border-color: #007bff;
  box-shadow: 0 0 6px rgba(0, 123, 255, 0.4);
}



#clearFilters {
  font-weight: bold;
  padding: 12px;
  border-radius: 12px;

  background: linear-gradient(135deg, #ff4d4d, #ff1a1a);
  border: none;
  color: white;

  transition: 0.3s ease-in-out;
}

#clearFilters:hover {
  transform: scale(1.03);
  background: linear-gradient(135deg, #ff1a1a, #cc0000);
}
  </style>

</head>

<body>

<nav class="navbar navbar-expand-lg bg-light shadow-sm">
  <div class="container-fluid">
    <a class="navbar-brand" href="index.html">MyShop</a>

    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link active" href="shop.html">Shop</a></li>

        <div class="dropdown ms-3">
          <button class="btn btn-light dropdown-toggle" data-bs-toggle="dropdown">Filters</button>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item filter-option" data-filter="category">Category</a></li>
            <li><a class="dropdown-item filter-option" data-filter="brand">Brand</a></li>
            <li><a class="dropdown-item filter-option" data-filter="price">Price</a></li>
            <li><a class="dropdown-item filter-option" data-filter="offer">Offers</a></li>
          </ul>
        </div>
      </ul>

      <button class="btn btn-primary me-3" onclick="openCart()">🛒 Cart <span id="cartCount">0</span></button>

      <input type="text" id="searchInput" class="form-control w-25" placeholder="Search">
    </div>
  </div>
</nav>

<div class="container">
  <div id="filterBox">
<div id="categoryFilter" class="filter-section">
  <label>Category</label>
  <select id="filterCategory">
    <option value="All">All</option>
    <option value="beauty">Beauty</option>
    <option value="fragrances">Fragrances</option>
    <option value="groceries">Groceries</option>
  </select>
</div>

    <div id="brandFilter" class="filter-section">
      <label>Brand</label>
      <select id="filterBrand">
        <option value="All">All</option>
        <option value="Dior">Dior</option>
        <option value="Chanel">Chanel</option>
      </select>
    </div>

    <div id="priceFilter" class="filter-section">
      <label>Price</label>
      <select id="filterPrice">
        <option value="All">All</option>
        <option value="0-50">₹0 - ₹50</option>
        <option value="50-100">₹50 - ₹100</option>
        <option value="100-500">₹100 - ₹500</option>
      </select>
    </div>

    <div id="offerFilter" class="filter-section">
      <label>Offers</label>
      <select id="filterOffer">
        <option value="All">All</option>
        <option value="10">10% Off</option>
        <option value="30">30% Off</option>
        <option value="50">50% Off</option>
      </select>
    </div>

    <button id="clearFilters" class="btn btn-danger w-100">Clear Filters</button>
  </div>
</div>

<div class="container mt-4">
  <div class="row" id="productList"></div>
    <ul class="pagination justify-content-center mt-4" id="pagination"></ul>
</div>

<div class="offcanvas offcanvas-start" id="offcanvas">
  <div class="offcanvas-header">
    <h5>My Cart</h5>
    <button class="btn-close" data-bs-dismiss="offcanvas"></button>
  </div>
  <div class="offcanvas-body">
    <table class="table table-bordered">
      <tbody id="cartBody"></tbody>
    </table>
    <h4>Total: ₹<span id="cartTotal">0</span></h4>
    
      <button class="btn btn-success w-100" onclick="checkoutCart()">Buy Now</button>
    </div>
  </div>
</div>

<script src="./bootstrap.bundle.js"></script>
<script src="./app.js"></script>

</body>
</html>
