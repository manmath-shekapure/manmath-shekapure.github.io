<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout</title>

<link rel="stylesheet" href="./bootstrap.bundle.js">

<style>
  body {
    background: #f5f7fa;
  }
  .checkout-box {
    background: #fff;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
  }
  .product-img {
    border-radius: 12px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
  }
  h2 {
    font-weight: 700;
  }
  .price-box {
    background: #e8ffe6;
    padding: 10px;
    border-radius: 8px;
    display: inline-block;
    font-weight: bold;
    font-size: 20px;
    color: #0c8a14;
  }
  .total-box {
    background: #fff1d6;
    padding: 10px;
    border-radius: 8px;
    font-size: 22px;
    font-weight: 700;
  }
  .btn-success {
    padding: 12px;
    font-size: 18px;
    font-weight: 600;
    border-radius: 10px;
  }
</style>
</head>

<body>

<nav class="navbar navbar-expand-lg bg-white shadow-sm">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold fs-4" href="/index.html">MyShop</a>
  </div>
</nav>

<div class="container mt-5">
  <div id="checkoutDetails" class="checkout-box"></div>
</div>

<script src="./bootstrap.bundle.js"></script>

<script>
const params = new URLSearchParams(location.search);
const id = params.get("id");

fetch(`https://dummyjson.com/products/${id}`)
.then(res => res.json())
.then(p => {
  document.getElementById("checkoutDetails").innerHTML = `
    <div class="row g-4">

      <!-- LEFT -->
      <div class="col-md-6">
        <img src="${p.thumbnail}" class="img-fluid product-img">
      </div>

      <!-- RIGHT -->
      <div class="col-md-6">
        <h2>${p.title}</h2>
        <p class="text-muted">${p.description}</p>

        <div class="mt-2 price-box">Price: ₹${p.price}</div>

        <div class="mt-4">
          <label class="fw-bold">Quantity</label>
          <input type="number" id="qty" value="1" min="1" class="form-control w-25 mt-1">
        </div>

        <div class="mt-4 total-box">
          Total: ₹<span id="total">${p.price}</span>
        </div>

        <button class="btn btn-success mt-4 w-100" onclick="placeOrder('${p.title}')">
          ✔ Confirm Order
        </button>
      </div>

    </div>
  `;

  document.getElementById("qty").addEventListener("input", function(){
    let q = Number(this.value) || 1;
    document.getElementById("total").innerText = q * p.price;
  });

});

function placeOrder(title){
  alert("Order placed successfully for " + title + " 🎉");
  window.location.href = "shop.html";
}
</script>

</body>
</html>
